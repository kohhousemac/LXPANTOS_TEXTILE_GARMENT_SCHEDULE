<script>
(function () {
  'use strict';

  var ROUTE_IDS = __ROUTE_IDS__;
  var CARRIER_ORDER = ['SITC', 'SINOKOR', 'GSL', 'EMC', 'WHL', 'CNC', 'KMTC', 'PANOCEAN', 'DONGJIN', 'NAMSUNG', 'SM LINE', 'MSC'];
  var CARRIER_COLOR_OVERRIDE = { 'HEUNG-A': '#4d7c0f', MSC: '#a16207', 'SM LINE': '#0e7490', SITC: '#2f9e44', CNC: '#0891b2', GSL: '#8a5a2e', SINOKOR: '#eab308', KMTC: '#7c3aed', PANOCEAN: '#ea580c', 'YANG MING': '#be123c', DONGJIN: '#0d9488', NAMSUNG: '#db2777', 'CMA CGM': '#1d4ed8', MSK: '#0f5fa8' };

  function carrierColor(carrier) {
    if (carrier && carrier.indexOf('/') !== -1) carrier = carrier.split('/')[0].trim();
    if (CARRIER_COLOR_OVERRIDE[carrier]) return CARRIER_COLOR_OVERRIDE[carrier];
    var idx = CARRIER_ORDER.indexOf(carrier);
    if (idx === -1) {
      idx = 0;
      for (var i = 0; i < carrier.length; i++) idx = (idx * 31 + carrier.charCodeAt(i)) % 8;
    }
    return dash.colors[idx % dash.colors.length];
  }

  (function buildLegend() {
    var el = document.getElementById('lx-legend');
    if (!el) return;
    el.replaceChildren.apply(el, CARRIER_ORDER.map(function (c) {
      var item = document.createElement('span');
      item.className = 'lx-legend-item';
      var dot = document.createElement('i');
      dot.className = 'lx-legend-dot';
      dot.style.background = carrierColor(c);
      item.appendChild(dot);
      item.appendChild(document.createTextNode(c));
      return item;
    }));
  })();

  var parseKey = function (s) {
    if (!s) return Infinity;
    var m = /^(\d{2})-(\d{2})/.exec(s);
    if (!m) return Infinity;
    var mo = parseInt(m[1], 10);
    if (mo <= 3) mo += 12;
    return mo * 100 + parseInt(m[2], 10);
  };

  var onlyChanges = false;
  var lastRendered = {};

  Array.prototype.slice.call(document.querySelectorAll('.lx-only-changes')).forEach(function (cb) {
    cb.addEventListener('change', function () {
      onlyChanges = cb.checked;
      Array.prototype.slice.call(document.querySelectorAll('.lx-only-changes')).forEach(function (other) {
        other.checked = onlyChanges;
      });
      ROUTE_IDS.forEach(function (id) { dash.draw('rows-' + id); });
    });
  });

  function showFail(el) {
    var wrap = document.createElement('div');
    wrap.className = 'lx-failstate';
    var dot = document.createElement('i');
    dot.className = 'lx-fail-dot';
    var txt = document.createElement('span');
    txt.textContent = 'Failed to load';
    wrap.appendChild(dot);
    wrap.appendChild(txt);
    el.replaceChildren(wrap);
  }

  function withState(el, id, onOk) {
    var g = dash.data(id);
    if (g.status === 'loading') {
      el.classList.add('dash-skeleton');
      return;
    }
    el.classList.remove('dash-skeleton');
    if (g.status === 'error' || g.status === 'connect' || g.status === 'declined') {
      showFail(el);
      return;
    }
    onOk(g);
  }

  function chip(label, n, tone) {
    var span = document.createElement('span');
    span.className = 'lx-chip' + (n > 0 ? ' lx-chip--' + tone : '');
    var dot = document.createElement('i');
    dot.className = 'lx-dot';
    span.appendChild(dot);
    span.appendChild(document.createTextNode(label + ' ' + n));
    return span;
  }

  function renderBadges(el, routeId) {
    withState(el, 'route_meta', function (g) {
      var row = (g.data || []).filter(function (r) { return r.routeId === routeId; })[0];
      if (!row) { el.replaceChildren(); return; }
      el.replaceChildren(
        chip('New', row.newCount, 'ok'),
        chip('Changed', row.changedCount, 'warn'),
        chip('Excluded', row.excludedCount, 'bad')
      );
    });
  }

  ROUTE_IDS.forEach(function (id) {
    dash.draw('badges-' + id, function (el) { renderBadges(el, id); });
  });

  function fmtHolidayDate(startIso, endIso) {
    function mmdd(iso) { var p = iso.split('-'); return p[1] + '/' + p[2]; }
    return startIso === endIso ? mmdd(startIso) : mmdd(startIso) + '–' + mmdd(endIso);
  }

  function renderHolidays(el) {
    withState(el, 'holidays', function (g) {
      var all = g.data || [];
      var now = new Date();
      var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      var horizon = new Date(today.getTime() + 45 * 86400000);
      var upcoming = all.filter(function (h) {
        var end = new Date(h.end + 'T00:00:00');
        var start = new Date(h.start + 'T00:00:00');
        return end >= today && start <= horizon;
      }).sort(function (a, b) { return a.start < b.start ? -1 : a.start > b.start ? 1 : 0; });
      if (!upcoming.length) {
        el.replaceChildren();
        return;
      }
      el.replaceChildren.apply(el, upcoming.map(function (h) {
        var chipEl = document.createElement('span');
        chipEl.className = 'lx-holiday-chip';
        var dateEl = document.createElement('span');
        dateEl.className = 'lx-holiday-date';
        dateEl.textContent = h.flag + ' ' + fmtHolidayDate(h.start, h.end);
        chipEl.appendChild(dateEl);
        if (h.url) {
          var nameLink = document.createElement('a');
          nameLink.className = 'lx-holiday-name';
          nameLink.href = h.url;
          nameLink.target = '_blank';
          nameLink.rel = 'noopener noreferrer';
          nameLink.textContent = h.country + ' · ' + h.name;
          chipEl.appendChild(nameLink);
        } else {
          var nameEl = document.createElement('span');
          nameEl.className = 'lx-holiday-name';
          nameEl.textContent = h.country + ' · ' + h.name;
          chipEl.appendChild(nameEl);
        }
        return chipEl;
      }));
    });
  }

  dash.draw('holidays-banner', function (el) { renderHolidays(el); });

  function latestUpdateDate(rows) {
    var now = new Date();
    var best = null, bestTime = -Infinity;
    rows.forEach(function (r) {
      var m = /^(\d{1,2})\/(\d{1,2})$/.exec(r.updateDate || '');
      if (!m) return;
      var mo = parseInt(m[1], 10) - 1, da = parseInt(m[2], 10);
      var d = new Date(now.getFullYear(), mo, da);
      if (d.getTime() - now.getTime() > 5 * 86400000) d = new Date(now.getFullYear() - 1, mo, da);
      if (d.getTime() > bestTime) { bestTime = d.getTime(); best = r.updateDate; }
    });
    return best;
  }

  dash.draw('last-updated', function (el) {
    withState(el, 'route_meta', function (g) {
      var rows = (g.data || []).filter(function (r) { return r.group !== 'med' && r.group !== 'us' && r.group !== 'ca'; });
      if (!rows.length) { el.textContent = ''; return; }
      el.textContent = 'Update : ' + (latestUpdateDate(rows) || rows[0].updateDate);
    });
  });

  dash.draw('last-updated-cc', function (el) {
    withState(el, 'route_meta', function (g) {
      var rows = (g.data || []).filter(function (r) { return r.group === 'ca'; });
      if (!rows.length) { el.textContent = ''; return; }
      el.textContent = 'Update : ' + (latestUpdateDate(rows) || rows[0].updateDate);
    });
  });

  dash.draw('last-updated-usa', function (el) {
    withState(el, 'route_meta', function (g) {
      var rows = (g.data || []).filter(function (r) { return r.group === 'us'; });
      if (!rows.length) { el.textContent = ''; return; }
      el.textContent = 'Update : ' + (latestUpdateDate(rows) || rows[0].updateDate);
    });
  });

  dash.draw('last-updated-med', function (el) {
    withState(el, 'route_meta', function (g) {
      var rows = (g.data || []).filter(function (r) { return r.group === 'med'; });
      if (!rows.length) { el.textContent = ''; return; }
      el.textContent = 'Update : ' + (latestUpdateDate(rows) || rows[0].updateDate);
    });
  });

  function scheduleDate(s) {
    var m = /^(\d{1,2})-(\d{1,2})/.exec(s || '');
    if (!m) return null;
    var mo = parseInt(m[1], 10) - 1, da = parseInt(m[2], 10);
    var now = new Date(), best = null, bestDiff = Infinity;
    [-1, 0, 1].forEach(function (yOff) {
      var d = new Date(now.getFullYear() + yOff, mo, da);
      var diff = Math.abs(d.getTime() - now.getTime());
      if (diff < bestDiff) { bestDiff = diff; best = d; }
    });
    return best;
  }

  var STAGE_LABEL = { upcoming: 'Upcoming', transit: 'At sea', arrived: 'Arrived' };
  var ARRIVED_RETENTION_MS = 14 * 86400000;

  function rowStage(v) {
    var eta = scheduleDate(v.eta), etd = scheduleDate(v.etd), now = Date.now();
    if (eta && now >= eta.getTime()) return 'arrived';
    if (etd && now >= etd.getTime()) return 'transit';
    return 'upcoming';
  }

  function stageCell(stage) {
    var td = document.createElement('td');
    var chip = document.createElement('span');
    chip.className = 'lx-chip' + (stage === 'arrived' ? ' lx-chip--ok' : stage === 'transit' ? ' lx-chip--warn' : '');
    chip.textContent = STAGE_LABEL[stage] || stage;
    td.appendChild(chip);
    return td;
  }

  function statusCheck(status) {
    var check = document.createElement('span');
    check.className = 'lx-status-check lx-status-check--' + status;
    check.textContent = '✓';
    check.title = status === 'new' ? 'New sailing' : 'Changed';
    return check;
  }

  function dateCell(value, prevValue, changed) {
    var td = document.createElement('td');
    td.className = 'lx-date';
    var main = document.createElement('div');
    if (changed) main.appendChild(statusCheck('changed'));
    var mm = /^(\d{1,2}-\d{1,2})\s*\((\w+)\)/.exec(value || '');
    if (mm) {
      var dd = document.createElement('span'); dd.className = 'lx-d'; dd.textContent = mm[1].replace('-', '.');
      var dw = document.createElement('span'); dw.className = 'lx-dow'; dw.textContent = mm[2];
      main.appendChild(dd); main.appendChild(dw);
    } else {
      main.appendChild(document.createTextNode(value || '—'));
    }
    td.appendChild(main);
    if (changed && prevValue) {
      var prev = document.createElement('div');
      prev.className = 'lx-prev';
      prev.textContent = prevValue;
      td.appendChild(prev);
    }
    return td;
  }

  var USA_ROUTE_IDS = ['vnhph_uslax', 'vnhph_usnyc', 'vnsgn_uslgb', 'vnsgn_usnyc', 'idjkt_uslgb', 'idjkt_usnyc', 'khpnh_uslgb', 'khpnh_usnyc'];
  // Calling Order column removed 2026-11-10 (user): the port-call panel beside each table lists every call.
  var CALLING_ORDER_ROUTES = [];

  function rotationCell(v) {
    var td = document.createElement('td');
    td.className = 'lx-rot';
    var rot = v.rotation;
    if (Array.isArray(rot)) rot = rot.join(' → ');
    var ports = String(rot || '').split(/\s*(?:→|->|>|,)\s*/).filter(Boolean);
    if (!ports.length) { td.textContent = '—'; td.title = '기항 순서 수집 대기'; return td; }
    ports.forEach(function (p, i) {
      if (i) { var a = document.createElement('span'); a.className = 'lx-rot-arrow'; a.textContent = '›'; td.appendChild(a); }
      var s = document.createElement('span');
      s.className = 'lx-rot-port' + (i === 0 ? ' is-pol' : '') + (i === ports.length - 1 ? ' is-pod' : '');
      s.textContent = p;
      td.appendChild(s);
    });
    return td;
  }

  function buildRow(v, routeId) {
    var tr = document.createElement('tr');
    tr.className = 'lx-row-carrier';
    tr.dataset.carrier = v.carrier;
    tr.style.setProperty('--row-tint', carrierColor(v.carrier));

    var tdCarrier = document.createElement('td');
    if (v.status === 'new') tdCarrier.appendChild(statusCheck('new'));
    var tag = document.createElement('span');
    tag.className = 'lx-tag';
    // Joint-service rows: ⛔ goes right after each carrier whose own schedule shows no space (closedCarriers).
    var closedList = typeof v.closedCarriers === 'string' && v.closedCarriers ? v.closedCarriers.split(/\s*\/\s*/) : null;
    {
      // Two carriers per line: a 3rd/4th carrier on a joint-service row wraps to the next line.
      String(v.carrier).split(/\s*\/\s*/).forEach(function (c, i) {
        if (i) {
          tag.appendChild(document.createTextNode(i % 2 === 0 ? ' /' : ' / '));
          if (i % 2 === 0) tag.appendChild(document.createElement('br'));
        }
        tag.appendChild(document.createTextNode(c));
        if (closedList && closedList.indexOf(c) !== -1) {
          var cb = document.createElement('span');
          cb.className = 'lx-bkg-closed lx-bkg-closed--inline';
          cb.textContent = '⛔';
          cb.setAttribute('aria-label', c + ' 부킹 불가');
          cb.title = c + ' 스케줄에서 부킹 불가(빨간색)';
          tag.appendChild(cb);
        }
      });
    }
    // Joint-service row: carriers that publish a slightly different date for the same vessel/voyage.
    if (v.altDates) tag.title = '선사별 일정 차이: ' + v.altDates;
    tdCarrier.appendChild(tag);
    if (v.bookingClosed === true && !closedList) {
      var bk = document.createElement('span');
      bk.className = 'lx-bkg-closed';
      bk.textContent = '⛔';
      bk.title = '선사 스케줄에서 부킹 불가(빨간색)로 표시된 모선';
      bk.setAttribute('aria-label', '부킹 불가');
      tdCarrier.appendChild(bk);
    }

    var tdVessel = document.createElement('td');
    tdVessel.className = 'lx-vessel';
    tdVessel.appendChild(document.createTextNode(v.vessel));

    var tdVoyage = document.createElement('td');
    tdVoyage.className = 'lx-mono';
    tdVoyage.textContent = v.voyage;

    var fields = v.changedFields || [];
    var tdEtd = dateCell(v.etd, v.prevEtd, fields.indexOf('etd') !== -1);
    var tdEta = dateCell(v.eta, v.prevEta, fields.indexOf('eta') !== -1);

    var tdTt = document.createElement('td');
    tdTt.className = 'lx-num';
    var ttMain = document.createElement('div');
    if (fields.indexOf('tt') !== -1) ttMain.appendChild(statusCheck('changed'));
    var ttp = document.createElement('span'); ttp.className = 'lx-tt'; ttp.textContent = (typeof v.tt === 'number') ? v.tt + ' days' : '—'; ttMain.appendChild(ttp);
    tdTt.appendChild(ttMain);
    if (fields.indexOf('tt') !== -1 && typeof v.prevTt === 'number') {
      var ttPrev = document.createElement('div');
      ttPrev.className = 'lx-prev';
      ttPrev.textContent = v.prevTt + 'd';
      tdTt.appendChild(ttPrev);
    }

    tr.appendChild(tdCarrier);
    tr.appendChild(tdVessel);
    tr.appendChild(tdVoyage);
    tr.appendChild(tdEtd);
    tr.appendChild(tdEta);
    tr.appendChild(tdTt);
    tr.appendChild(stageCell(rowStage(v)));
    if (CALLING_ORDER_ROUTES.indexOf(routeId) !== -1) tr.appendChild(rotationCell(v));
    return tr;
  }

  function renderTable(el, id) {
    withState(el, id, function (g) {
      var rows = (g.data || []).slice().sort(function (a, b) { return parseKey(a.etd) - parseKey(b.etd); });
      if (onlyChanges) rows = rows.filter(function (r) { return r.status !== 'unchanged' && r.status !== 'same' && r.status !== 'departed'; });
      rows = rows.filter(function (r) { return cfPasses(el, r); });
      rows = rows.filter(function (r) {
        if (rowStage(r) !== 'arrived') return true;
        var eta = scheduleDate(r.eta);
        return !eta || (Date.now() - eta.getTime()) < ARRIVED_RETENTION_MS;
      });
      lastRendered[id] = rows;
      if (!rows.length) {
        var tr = document.createElement('tr');
        tr.className = 'lx-empty-row';
        var td = document.createElement('td');
        td.colSpan = CALLING_ORDER_ROUTES.indexOf(id) !== -1 ? 8 : 7;
        td.textContent = 'No sailings to display.';
        tr.appendChild(td);
        el.replaceChildren(tr);
        return;
      }
      el.replaceChildren.apply(el, rows.map(function (r) { return buildRow(r, id); }));
    });
  }

  ROUTE_IDS.forEach(function (id) {
    dash.draw('rows-' + id, function (el) { renderTable(el, id); });
  });

  // ---- Carrier filter (Asia POL groups): checkboxes under the POD tabs ----
  // Include filter: nothing checked = every carrier shown; once carriers are
  // checked, only rows sold by one of them stay (joint rows count if any
  // carrier matches). Remembered per POL in this browser only.
  var CF_KEY = 'lx-cf-on-v1';
  // Lazily initialised: rows can be drawn before this block runs.
  var cfOff;
  function cfState() {
    if (!cfOff) {
      try { cfOff = JSON.parse(localStorage.getItem(CF_KEY) || '{}') || {}; } catch (e) { cfOff = {}; }
    }
    return cfOff;
  }
  function cfSave() { try { localStorage.setItem(CF_KEY, JSON.stringify(cfState())); } catch (e) {} }
  function cfSplit(c) { return String(c || '').split(/\s*\/\s*/).filter(Boolean); }
  function cfPolOf(el) {
    var g = el && el.closest ? el.closest('#net-asia .lx-group[data-pol]') : null;
    return g ? g.dataset.pol : null;
  }
  function cfPasses(el, r) {
    var pol = cfPolOf(el);
    var on = pol && cfState()[pol];
    if (!on || !on.length) return true;
    return cfSplit(r.carrier).some(function (c) { return on.indexOf(c) !== -1; });
  }
  function cfRedraw(groupEl) {
    Array.prototype.slice.call(groupEl.querySelectorAll('tbody[data-draw^="rows-"]')).forEach(function (tb) {
      dash.draw(tb.getAttribute('data-draw'));
    });
  }
  function cfBuild() {
    Array.prototype.slice.call(document.querySelectorAll('#net-asia .lx-group[data-pol] > .lx-subnav')).forEach(function (nav) {
      var g = nav.parentNode;
      if (g.querySelector(':scope > .lx-carrier-filter')) return;
      var box = document.createElement('div');
      box.className = 'lx-carrier-filter';
      box.dataset.cfPol = g.dataset.pol;
      box.setAttribute('aria-label', 'Carrier filter');
      nav.insertAdjacentElement('afterend', box);
    });
    Array.prototype.slice.call(document.querySelectorAll('.lx-carrier-filter[data-cf-pol]')).forEach(function (box) {
      var pol = box.dataset.cfPol;
      var groupEl = box.closest('.lx-group[data-pol]');
      if (!groupEl) return;
      var seen = {};
      Array.prototype.slice.call(groupEl.querySelectorAll('tbody[data-draw^="rows-"]')).forEach(function (tb) {
        var g = dash.data(tb.getAttribute('data-draw').slice(5));
        ((g && g.data) || []).forEach(function (r) { cfSplit(r.carrier).forEach(function (c) { seen[c] = 1; }); });
      });
      var list = Object.keys(seen).sort(function (a, b) {
        var ia = CARRIER_ORDER.indexOf(a), ib = CARRIER_ORDER.indexOf(b);
        if (ia === -1) ia = 99; if (ib === -1) ib = 99;
        return ia - ib || a.localeCompare(b);
      });
      if (!list.length) { box.replaceChildren(); return; }
      var on = (cfState()[pol] || []).filter(function (c) { return list.indexOf(c) !== -1; });
      var nodes = [];
      var lab = document.createElement('span');
      lab.className = 'lx-cf-label';
      lab.textContent = 'Carrier · 선택한 선사만 표시';
      nodes.push(lab);
      list.forEach(function (c) {
        var item = document.createElement('label');
        item.className = 'lx-cf-item' + (on.indexOf(c) !== -1 ? ' is-on' : '');
        item.style.setProperty('--cf-c', carrierColor(c));
        var cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = on.indexOf(c) !== -1;
        cb.addEventListener('change', function () {
          var cur = (cfState()[pol] || []).filter(function (x) { return x !== c; });
          if (cb.checked) cur.push(c);
          cfState()[pol] = cur;
          item.classList.toggle('is-on', cb.checked);
          all.hidden = !cur.length;
          cfSave();
          cfRedraw(groupEl);
        });
        var dot = document.createElement('i');
        dot.className = 'lx-legend-dot';
        item.appendChild(cb);
        item.appendChild(dot);
        item.appendChild(document.createTextNode(c));
        nodes.push(item);
      });
      var all = document.createElement('button');
      all.type = 'button';
      all.className = 'lx-cf-all';
      all.textContent = '선택 해제';
      all.hidden = !on.length;
      all.addEventListener('click', function () { cfState()[pol] = []; cfSave(); cfBuild(); cfRedraw(groupEl); });
      nodes.push(all);
      box.replaceChildren.apply(box, nodes);
    });
  }
  dash.onData(cfBuild);

  // ---- Port berthing wait, per lane ----
  var BERTH_WAIT_CAP_DAYS = 3;

  function berthTone(days) {
    if (typeof days !== 'number') return null;
    if (days >= 1) return 'bad';
    if (days >= 0.5) return 'warn';
    return null;
  }

  function renderBerthMini(el, routeId) {
    withState(el, 'berthing_wait', function (g) {
      var row = (g.data || []).filter(function (r) { return r.routeId === routeId; })[0];
      if (!row || row.status === 'no_tool') {
        el.replaceChildren();
        var empty = document.createElement('p');
        empty.className = 'lx-berth-mini-empty';
        empty.textContent = '접안 대기: 선사 모선 추적 도구 미확인';
        el.appendChild(empty);
        return;
      }
      if (row.status === 'collecting' || !row.calls) {
        el.replaceChildren();
        var collecting = document.createElement('p');
        collecting.className = 'lx-berth-mini-empty';
        collecting.textContent = '접안 대기: 데이터 수집 중 (최근 60일, ' + (row.calls || 0) + '건 확보)';
        el.appendChild(collecting);
        return;
      }
      var tone = berthTone(row.avg_days);
      var pct = Math.max(4, Math.min(100, (row.avg_days / BERTH_WAIT_CAP_DAYS) * 100));
      var wrap = document.createElement('div');
      wrap.className = 'lx-berth-mini-row';
      var label = document.createElement('span');
      label.className = 'lx-berth-mini-label';
      label.textContent = (row.pod || routeId) + ' 접안 대기';
      var track = document.createElement('div');
      track.className = 'lx-berth-mini-track';
      var fill = document.createElement('div');
      fill.className = 'lx-berth-mini-fill' + (tone ? ' lx-berth-mini-fill--' + tone : '');
      fill.style.width = pct + '%';
      track.appendChild(fill);
      var note = document.createElement('span');
      note.className = 'lx-berth-mini-note';
      note.textContent = row.avg_days + 'd 평균 (최대 ' + row.max_days + 'd · ' + row.calls + '건, 최근 ' + (row.windowDays || 60) + '일)';
      wrap.appendChild(label);
      wrap.appendChild(track);
      wrap.appendChild(note);
      el.replaceChildren(wrap);
    });
  }

  ROUTE_IDS.forEach(function (id) {
    dash.draw('berthmini-' + id, function (el) { renderBerthMini(el, id); });
  });

  // ---- Network (ASIA / C.America / Med) navigation ----
  var netSections = Array.prototype.slice.call(document.querySelectorAll('.lx-group[data-net]'));
  var netTabs = Array.prototype.slice.call(document.querySelectorAll('.lx-nav-btn[data-net]'));

  function showNet(netCode, fromHash) {
    netSections.forEach(function (sec) { sec.hidden = sec.dataset.net !== netCode; });
    netTabs.forEach(function (btn) { btn.setAttribute('aria-selected', btn.dataset.net === netCode ? 'true' : 'false'); });
    var updatedRow = document.getElementById('lx-updated-row');
    if (updatedRow) updatedRow.hidden = netCode !== 'asia';
    if (netCode === 'ca' && window.gtRedraw) {
      (window.requestAnimationFrame || function (fn) { setTimeout(fn, 0); })(function () {
        if (window.gtRedraw.cong) window.gtRedraw.cong();
        if (window.gtRedraw.freight) window.gtRedraw.freight();
      });
    }
    if (!fromHash && dash.setLink) {
      if (netCode === 'ca') {
        dash.setLink('ca');
      } else if (netCode === 'med' || netCode === 'usa') {
        var medGroup = netSections.filter(function (s) { return s.dataset.net === netCode; })[0];
        var medPolGroup = medGroup ? Array.prototype.slice.call(medGroup.querySelectorAll('.lx-group[data-pol]')).filter(function (s) { return !s.hidden; })[0] : null;
        var medPodPage = medPolGroup ? medPolGroup.querySelector('.lx-page:not([hidden])') : null;
        dash.setLink(medPolGroup && medPodPage ? medPolGroup.dataset.pol + '-' + medPodPage.dataset.pod : netCode);
      } else {
        var activeGroup = polSections.filter(function (s) { return !s.hidden; })[0];
        var activePage = activeGroup ? activeGroup.querySelector('.lx-page:not([hidden])') : null;
        dash.setLink(activeGroup && activePage ? activeGroup.dataset.pol + '-' + activePage.dataset.pod : 'asia');
      }
    }
  }

  netTabs.forEach(function (btn) {
    btn.addEventListener('click', function () { showNet(btn.dataset.net); });
  });

  // ---- Caucedo POL tabs (Shenzhen / Shanghai), 2026-11-10 ----
  (function () {
    var btns = Array.prototype.slice.call(document.querySelectorAll('.lx-nav-btn[data-cc-pol]'));
    var panes = Array.prototype.slice.call(document.querySelectorAll('.cc-pol[data-cc-pol]'));
    function show(code) {
      panes.forEach(function (p) { p.hidden = p.dataset.ccPol !== code; });
      btns.forEach(function (b) { b.setAttribute('aria-selected', b.dataset.ccPol === code ? 'true' : 'false'); });
    }
    btns.forEach(function (b) { b.addEventListener('click', function () { show(b.dataset.ccPol); }); });
  })();

  // ---- C.America POD navigation ----
  var caPodPages = Array.prototype.slice.call(document.querySelectorAll('.lx-page[data-ca-pod]'));
  var caPodTabs = Array.prototype.slice.call(document.querySelectorAll('.lx-subnav-btn[data-ca-pod]'));

  function showCaPod(podCode) {
    caPodPages.forEach(function (p) { p.hidden = p.dataset.caPod !== podCode; });
    caPodTabs.forEach(function (b) { b.setAttribute('aria-selected', b.dataset.caPod === podCode ? 'true' : 'false'); });
    if (window.gtRedraw) {
      (window.requestAnimationFrame || function (fn) { setTimeout(fn, 0); })(function () {
        if (window.gtRedraw.cong) window.gtRedraw.cong();
        if (window.gtRedraw.freight) window.gtRedraw.freight();
        if (window.gtRedraw.ccCong) window.gtRedraw.ccCong();
      });
    }
  }

  caPodTabs.forEach(function (btn) {
    btn.addEventListener('click', function () { showCaPod(btn.dataset.caPod); });
  });

  // ---- POL + POD navigation ----
  var polSections = Array.prototype.slice.call(document.querySelectorAll('.lx-group[data-pol]'));
  var polTabs = Array.prototype.slice.call(document.querySelectorAll('.lx-nav-btn[data-pol]'));

  function showPol(polCode, fromHash) {
    var owner = polSections.filter(function (s) { return s.dataset.pol === polCode; })[0];
    var ownerNet = owner && owner.closest ? owner.closest('.lx-group[data-net]') : null;
    var scopedSections = ownerNet ? polSections.filter(function (s) { return s.closest && s.closest('.lx-group[data-net]') === ownerNet; }) : polSections;
    var scopedTabs = ownerNet ? polTabs.filter(function (b) { return b.closest && b.closest('.lx-group[data-net]') === ownerNet; }) : polTabs;
    scopedSections.forEach(function (sec) { sec.hidden = sec.dataset.pol !== polCode; });
    scopedTabs.forEach(function (btn) { btn.setAttribute('aria-selected', btn.dataset.pol === polCode ? 'true' : 'false'); });
    if (!fromHash) {
      var activeGroup = scopedSections.filter(function (s) { return s.dataset.pol === polCode; })[0];
      var activePage = activeGroup ? activeGroup.querySelector('.lx-page:not([hidden])') : null;
      if (activePage && dash.setLink) dash.setLink(polCode + '-' + activePage.dataset.pod);
    }
  }

  polTabs.forEach(function (btn) {
    btn.addEventListener('click', function () { showPol(btn.dataset.pol); });
  });

  function showPod(groupEl, podCode, fromHash) {
    Array.prototype.slice.call(groupEl.querySelectorAll('.lx-page')).forEach(function (p) {
      p.hidden = p.dataset.pod !== podCode;
    });
    Array.prototype.slice.call(groupEl.querySelectorAll('.lx-subnav-btn')).forEach(function (b) {
      b.setAttribute('aria-selected', b.dataset.pod === podCode ? 'true' : 'false');
    });
    if (!fromHash && dash.setLink) dash.setLink(groupEl.dataset.pol + '-' + podCode);
  }

  polSections.forEach(function (groupEl) {
    Array.prototype.slice.call(groupEl.querySelectorAll('.lx-subnav-btn')).forEach(function (btn) {
      btn.addEventListener('click', function () { showPod(groupEl, btn.dataset.pod); });
    });
  });

  var initialHash = (location.hash || '').slice(1);
  if (initialHash === 'ca') {
    showNet('ca', true);
  } else if (initialHash === 'med') {
    showNet('med', true);
  } else if (initialHash === 'usa') {
    showNet('usa', true);
  } else if (initialHash && initialHash.indexOf('-') !== -1) {
    var parts = initialHash.split('-');
    var polCode = parts[0];
    var podCode = parts.slice(1).join('-');
    var ownerGroup = polSections.filter(function (g) { return g.dataset.pol === polCode; })[0];
    if (ownerGroup && ownerGroup.querySelector('.lx-page[data-pod="' + podCode + '"]')) {
      var ownerNetSection = ownerGroup.closest ? ownerGroup.closest('.lx-group[data-net]') : null;
      var ownerNetCode = ownerNetSection ? ownerNetSection.dataset.net : 'asia';
      showNet(ownerNetCode, true);
      showPol(polCode, true);
      showPod(ownerGroup, podCode, true);
    }
  }

  // ---- copy to clipboard ----
  function copyText(text, btn) {
    function onDone() {
      if (!btn) return;
      var original = btn.textContent;
      btn.dataset.copied = 'true';
      btn.textContent = 'Copied';
      setTimeout(function () {
        btn.dataset.copied = 'false';
        btn.textContent = original;
      }, 1400);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(onDone, function () { fallbackCopy(text, onDone); });
    } else {
      fallbackCopy(text, onDone);
    }
  }

  function fallbackCopy(text, onDone) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
    onDone();
  }

  function tsvForRoute(routeId) {
    var rows = lastRendered[routeId];
    if (!rows) {
      var g = dash.data(routeId);
      rows = (g.data || []).slice().sort(function (a, b) { return parseKey(a.etd) - parseKey(b.etd); });
      if (onlyChanges) rows = rows.filter(function (r) { return r.status !== 'unchanged' && r.status !== 'same' && r.status !== 'departed'; });
    }
    var lines = ['Carrier\tVessel\tVoyage\tETD\tETA\tTT'];
    rows.forEach(function (v) {
      lines.push([v.carrier, v.vessel, v.voyage, v.etd || '', v.eta || '', (typeof v.tt === 'number') ? v.tt : ''].join('\t'));
    });
    return lines.join('\n');
  }

  Array.prototype.slice.call(document.querySelectorAll('.lx-copy-table')).forEach(function (btn) {
    btn.addEventListener('click', function () {
      copyText(tsvForRoute(btn.dataset.route), btn);
    });
  });
  // ---- copy all (Asia network) ----
  var copyAllAsiaBtn = document.getElementById('lx-copy-all-asia');
  if (copyAllAsiaBtn) copyAllAsiaBtn.addEventListener('click', function () {
    var lines = ['Lane\tCarrier\tVessel\tVoyage\tETD\tETA\tTT'];
    Array.prototype.slice.call(document.querySelectorAll('#net-asia tbody[data-draw^="rows-"]')).forEach(function (tb) {
      var id = tb.getAttribute('data-draw').slice(5);
      var h2 = document.getElementById('lane-' + id + '-h');
      var lane = h2 ? h2.textContent.replace(/[\u{1F1E6}-\u{1F1FF}]/gu, '').replace(/\s*→\s*/g, ' → ').replace(/\s+/g, ' ').trim() : id;
      var rows = lastRendered[id];
      if (!rows) rows = (dash.data(id).data || []).slice().sort(function (a, b) { return parseKey(a.etd) - parseKey(b.etd); });
      rows.forEach(function (v) {
        lines.push([lane, v.carrier, v.vessel, v.voyage, v.etd || '', v.eta || '', (typeof v.tt === 'number') ? v.tt : ''].join('\t'));
      });
    });
    copyText(lines.join('\n'), copyAllAsiaBtn);
  });

  // ---- download all Asia-network schedules as .xlsx (same file as the dashboard's 다운로드) ----
  function xlsxCrc32(bytes) {
    var c, table = xlsxCrc32.table;
    if (!table) {
      table = xlsxCrc32.table = new Uint32Array(256);
      for (var n = 0; n < 256; n++) { c = n; for (var k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1); table[n] = c >>> 0; }
    }
    var crc = 0xFFFFFFFF;
    for (var i = 0; i < bytes.length; i++) crc = table[(crc ^ bytes[i]) & 0xFF] ^ (crc >>> 8);
    return (crc ^ 0xFFFFFFFF) >>> 0;
  }
  function xlsxBytes(s) { return new TextEncoder().encode(s); }
  function u16(n) { return [n & 0xFF, (n >>> 8) & 0xFF]; }
  function u32(n) { return [n & 0xFF, (n >>> 8) & 0xFF, (n >>> 16) & 0xFF, (n >>> 24) & 0xFF]; }
  function xlsxZip(files) {
    var chunks = [], central = [], offset = 0, d = new Date();
    var time = ((d.getHours() & 0x1F) << 11) | ((d.getMinutes() & 0x3F) << 5) | ((d.getSeconds() >> 1) & 0x1F);
    var date = (((d.getFullYear() - 1980) & 0x7F) << 9) | (((d.getMonth() + 1) & 0xF) << 5) | (d.getDate() & 0x1F);
    files.forEach(function (f) {
      var name = xlsxBytes(f.name), data = xlsxBytes(f.data), crc = xlsxCrc32(data);
      var local = new Uint8Array([].concat(u32(0x04034b50), u16(20), u16(0), u16(0), u16(time), u16(date), u32(crc), u32(data.length), u32(data.length), u16(name.length), u16(0)));
      central.push({ name: name, crc: crc, size: data.length, offset: offset });
      chunks.push(local, name, data); offset += local.length + name.length + data.length;
    });
    var cStart = offset;
    central.forEach(function (c) {
      var rec = new Uint8Array([].concat(u32(0x02014b50), u16(20), u16(20), u16(0), u16(0), u16(time), u16(date), u32(c.crc), u32(c.size), u32(c.size), u16(c.name.length), u16(0), u16(0), u16(0), u16(0), u32(0), u32(c.offset)));
      chunks.push(rec, c.name); offset += rec.length + c.name.length;
    });
    chunks.push(new Uint8Array([].concat(u32(0x06054b50), u16(0), u16(0), u16(central.length), u16(central.length), u32(offset - cStart), u32(cStart), u16(0))));
    var total = 0; chunks.forEach(function (c) { total += c.length; });
    var out = new Uint8Array(total), q = 0; chunks.forEach(function (c) { out.set(c, q); q += c.length; });
    return out;
  }
  function xEsc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&apos;' }[c]; }); }
  function xCol(n) { var s = ''; n += 1; while (n > 0) { var r = (n - 1) % 26; s = String.fromCharCode(65 + r) + s; n = Math.floor((n - 1) / 26); } return s; }
  function xlsxWorkbook(sheetName, rows) {
    var sheet = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><cols><col min="1" max="2" width="14" customWidth="1"/><col min="3" max="3" width="30" customWidth="1"/><col min="4" max="4" width="22" customWidth="1"/><col min="5" max="5" width="10" customWidth="1"/><col min="6" max="7" width="12" customWidth="1"/><col min="8" max="9" width="11" customWidth="1"/><col min="10" max="10" width="36" customWidth="1"/></cols><sheetData>' +
      rows.map(function (row, ri) {
        return '<row r="' + (ri + 1) + '">' + row.map(function (cell, ci) {
          if (cell === null || cell === undefined || cell === '') return '';
          var ref = xCol(ci) + (ri + 1);
          // ETD/ETA are real Excel dates (serial number + yyyy-mm-dd format), not text.
          if (typeof cell === 'object' && typeof cell.d === 'number') return '<c r="' + ref + '" s="1"><v>' + cell.d + '</v></c>';
          return (typeof cell === 'number' && isFinite(cell)) ? '<c r="' + ref + '"><v>' + cell + '</v></c>'
            : '<c r="' + ref + '" t="inlineStr"><is><t xml:space="preserve">' + xEsc(cell) + '</t></is></c>';
        }).join('') + '</row>';
      }).join('') + '</sheetData></worksheet>';
    return xlsxZip([
      { name: '[Content_Types].xml', data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>' },
      { name: '_rels/.rels', data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>' },
      { name: 'xl/workbook.xml', data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="' + xEsc(sheetName).slice(0, 31) + '" sheetId="1" r:id="rId1"/></sheets></workbook>' },
      { name: 'xl/_rels/workbook.xml.rels', data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>' },
      { name: 'xl/styles.xml', data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><numFmts count="1"><numFmt numFmtId="164" formatCode="yyyy-mm-dd"/></numFmts><fonts count="1"><font><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>' },
      { name: 'xl/worksheets/sheet1.xml', data: sheet }
    ]);
  }
  // "11-07 (Sat)" -> Excel date serial (year = the one closest to today, same rule as the table).
  function xlsxDate(s) {
    var d = scheduleDate(s);
    if (!d) return s || '';
    return { d: Math.round((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - Date.UTC(1899, 11, 30)) / 864e5) };
  }
  function asiaRowsForXlsx() {
    var rows = [['POL', 'POD', 'Carrier', 'Vessel', 'Voyage', 'ETD', 'ETA', 'T/T (days)', 'Stage', 'Calling Order']];
    Array.prototype.slice.call(document.querySelectorAll('#net-asia tbody[data-draw^="rows-"]')).forEach(function (tb) {
      var id = tb.getAttribute('data-draw').slice(5);
      var h2 = document.getElementById('lane-' + id + '-h');
      var lane = h2 ? h2.textContent.replace(/[\u{1F1E6}-\u{1F1FF}]/gu, '').replace(/\s*→\s*/g, ' → ').replace(/\s+/g, ' ').trim() : id;
      var data = lastRendered[id];
      if (!data) {
        var g = dash.data(id);
        data = (g.data || []).slice().sort(function (a, b) { return parseKey(a.etd) - parseKey(b.etd); });
      }
      data.forEach(function (v) {
        var rot = v.rotation; if (Array.isArray(rot)) rot = rot.join(' → ');
        var co = String(rot || '').split(/\s*(?:→|->|>|,)\s*/).filter(Boolean).join(' → ');
        var pp = lane.split(' → ');
        rows.push([pp[0] || lane, pp[1] || '', v.carrier, v.vessel, v.voyage, xlsxDate(v.etd), xlsxDate(v.eta), (typeof v.tt === 'number') ? v.tt : '',
          STAGE_LABEL[rowStage(v)] || '', co]);
      });
    });
    return rows;
  }
  var dlBtn = document.getElementById('lx-download-xlsx');
  if (dlBtn) dlBtn.addEventListener('click', function () {
    try {
      var bytes = xlsxWorkbook('Asia Schedules', asiaRowsForXlsx());
      var blob = new Blob([bytes], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
      var now = new Date(), pad = function (n) { return (n < 10 ? '0' : '') + n; };
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'LX_Pantos_Asia_Schedule_' + now.getFullYear() + pad(now.getMonth() + 1) + pad(now.getDate()) + '.xlsx';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
      dlBtn.dataset.dlState = 'ok';
    } catch (e) { dlBtn.dataset.dlState = 'err'; }
    setTimeout(function () { delete dlBtn.dataset.dlState; }, 1800);
  });
})();
</script>
