<script>
(function () {
  'use strict';

  const fmtDT = (s) => s ? s.slice(5, 10).replace('-', '/') + ' ' + s.slice(11, 16) : '—';
  const ST = { ACTUAL: ['A', 'Departed'], ESTIMATED: ['E', 'Est.'], SKIP: ['S', 'Skip'], LONGTERM: ['L', 'Long-term'] };

  // The underlying datasets (collected daily from an external site) carry Korean labels for
  // stage/status/change text. We keep matching/filtering logic against those raw values, and
  // only translate what's shown to the viewer, so the page stays correct across daily refreshes.
  const STAGE_EN = { '선적 예정': 'Upcoming', '항해 중': 'At sea', '과테말라 도착': 'Arrived' };
  const trStage = (s) => STAGE_EN[s] || s;
  const CHANGE_EN = { 'ETA 당김': 'ETA pulled forward', 'ETA 지연': 'ETA delayed', 'ETD 당김': 'ETD pulled forward', 'ETD 지연': 'ETD delayed', '기준 수집': 'Baseline collection' };
  function trChange(s) {
    if (!s) return s;
    if (CHANGE_EN[s]) return CHANGE_EN[s];
    if (s.indexOf('상태 ') === 0) return 'Status ' + s.slice(3);
    if (s.indexOf('삭제') !== -1) return 'Removed';
    if (s.indexOf('신규') !== -1) return 'New';
    return s;
  }
  function trDelayNote(s) {
    if (!s) return s;
    return s
      .replace(/(.+?)부터 \+([\d.]+)일 변동 · /, '+$2d shift since $1 · ')
      .replace(/(.+?) 선석대기 ([\d.]+)일/, '$1 berth wait $2d');
  }
  function trLastShift(s) {
    if (!s) return s;
    return s.replace(/\(([^,]+), \+([\d.]+)일\)/, '($1, +$2d)');
  }
  function pill(td, status, actualLabel) {
    const s = ST[status];
    if (!s) return;
    const p = document.createElement('span');
    p.className = 'pill p-' + s[0];
    p.textContent = status === 'ACTUAL' && actualLabel ? actualLabel : s[1];
    td.appendChild(p);
  }
  function gtDateCell(tr, value, status, actualLabel) {
    const td = tr.insertCell();
    const t = document.createElement('span');
    t.textContent = fmtDT(value);
    if (status === 'SKIP') t.className = 'skip';
    td.appendChild(t);
    if (value) pill(td, status, actualLabel);
    return td;
  }
  window.gtDate = (s) => s ? new Date(s.replace(' ', 'T') + ':00') : null;

  // ---- freight rate chart
  (() => {
    const color = dash.colors[1];
    const updEl = document.querySelector('[data-draw="freight-updated"]');
    const box = document.getElementById('gt-freight-chart');

    function draw() {
      let d;
      try {
        d = dash.data('freight_rate');
        box.replaceChildren();
        if (d.status === 'error') { const f = document.createElement('div'); f.className = 'fail'; f.textContent = 'Failed to load'; box.appendChild(f); return; }
        if (d.status !== 'ok' || !d.data.length) return;
        const rows = d.data.slice().sort((a, b) => a.date < b.date ? -1 : 1).map((r) => ({ ...r, t: window.gtDate(r.date + ' 00:00').getTime() }));

        if (updEl) {
          updEl.classList.remove('dash-skeleton');
          const last = rows[rows.length - 1];
          updEl.textContent = last.period + ' ($' + last.ft40.toLocaleString() + ')';
        }

        const W = box.clientWidth || 640, top = 10, bottom = 26, left = 54, right = 16;
        const H = 220;
        const svg = d3.select(box).append('svg').attr('width', '100%').attr('viewBox', `0 0 ${W} ${H}`).attr('role', 'img').attr('aria-label', 'Shanghai to Guatemala market rate over time, 40ft containers');
        const tMin = rows[0].t, tMax = rows[rows.length - 1].t;
        const x = d3.scaleLinear([tMin, tMax], [left, W - right]);
        const yMax = d3.max(rows, (r) => r.ft40);
        const y = d3.scaleLinear().domain([0, yMax]).nice().range([H - bottom, top]);
        const g = svg.append('g');
        const yTicks = y.ticks(5);
        g.selectAll('line.grid').data(yTicks).join('line').attr('x1', left).attr('x2', W - right).attr('y1', (t) => y(t)).attr('y2', (t) => y(t)).attr('stroke', 'var(--cds-chart-grid)');
        g.selectAll('text.ytick').data(yTicks).join('text').attr('x', left - 8).attr('y', (t) => y(t) + 4).attr('text-anchor', 'end').attr('font-size', 11).attr('fill', 'var(--color-fg-muted)').text((t) => '$' + (t >= 1000 ? (t / 1000) + 'k' : t));
        const xTickN = Math.max(2, Math.floor((W - left) / 90));
        const xTickRows = [];
        for (let i = 0; i < xTickN; i++) {
          const target = tMin + (tMax - tMin) * i / (xTickN - 1);
          let best = rows[0], bestDiff = Infinity;
          for (const r of rows) { const diff = Math.abs(r.t - target); if (diff < bestDiff) { bestDiff = diff; best = r; } }
          if (!xTickRows.length || xTickRows[xTickRows.length - 1] !== best) xTickRows.push(best);
        }
        g.selectAll('text.xtick').data(xTickRows).join('text').attr('x', (r) => x(r.t)).attr('y', H - 8).attr('text-anchor', 'middle').attr('font-size', 11).attr('fill', 'var(--color-fg-muted)').text((r) => r.period.slice(0, 7).replace('-', '/'));

        const tip = d3.select(box).append('div').attr('class', 'tip').style('display', 'none');
        const line = d3.line().x((r) => x(r.t)).y((r) => y(r.ft40));
        g.append('path').datum(rows).attr('fill', 'none').attr('stroke', color).attr('stroke-width', 2).attr('d', line);
        g.selectAll('circle.pt-ft40').data(rows).join('circle').attr('class', 'pt-ft40')
          .attr('cx', (r) => x(r.t)).attr('cy', (r) => y(r.ft40)).attr('r', 2.5).attr('fill', color)
          .on('mousemove', (ev, r) => {
            const [mx, my] = d3.pointer(ev, box);
            tip.style('display', null).html('');
            tip.append('div').attr('class', 'd').text(r.period + (r.note ? ' · ' + r.note : ''));
            tip.append('div').text('$' + r.ft40.toLocaleString());
            const tw = tip.node().offsetWidth;
            tip.style('left', Math.min(mx + 12, box.clientWidth - tw - 4) + 'px').style('top', (my + 12) + 'px');
          })
          .on('mouseleave', () => tip.style('display', 'none'));
        box.style.minHeight = H + 'px';
      } catch (e) {
        box.replaceChildren();
        const f = document.createElement('div'); f.className = 'fail'; f.textContent = 'Chart error: ' + e.message; box.appendChild(f);
      }
    }
    window.gtRedraw = window.gtRedraw || {};
    window.gtRedraw.freight = draw;
    dash.onData(draw);
  })();

  // ---- Shanghai → Guatemala freight-rate report image (PNG), rebuilt from the latest data on every click ----
  (function () {
    function freightPng(rows) {
      var S = 2, W = 1400, H = 1000;
      var cv = document.createElement('canvas');
      cv.width = W * S; cv.height = H * S;
      var c = cv.getContext('2d');
      c.scale(S, S);
      var F = '"Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Segoe UI", sans-serif';
      var RED = '#a72b2a', BLUE = '#2563eb', TEXT = '#1f2937', SUB = '#6b7280', GRID = '#e5e7eb', PANEL = '#f9fafb', UP = '#d1453b', DOWN = '#1f8a5b';
      var QC = ['#60a5fa', '#a72b2a', '#f59e0b', '#10b981'];
      var money = function (v) { return '$' + Math.round(v).toLocaleString('en-US'); };
      var kfmt = function (v) { return '$' + (v >= 1000 ? (Math.round(v / 100) / 10) + 'k' : v); };
      var t = function (r) { return new Date(r.date + 'T00:00:00').getTime(); };
      var r40 = rows.filter(function (r) { return Number(r.ft40) > 0; });
        var first = r40[0], last = r40[r40.length - 1], prev = r40[r40.length - 2];

      c.fillStyle = '#ffffff'; c.fillRect(0, 0, W, H);
      c.fillStyle = RED; c.fillRect(0, 0, W, 6);
      c.textBaseline = 'alphabetic';
      c.fillStyle = TEXT; c.font = '700 28px ' + F;
      c.fillText('상해 → 과테말라(Puerto Quetzal) 해상운임 추이', 40, 56);
      c.fillStyle = SUB; c.font = '15px ' + F;
      c.fillText('40FT  |  USD  |  CY-CY  |  LX판토스 시장가  |  ' + first.date + ' ~ ' + last.date, 40, 84);
      c.textAlign = 'right';
      c.fillText('생성 ' + new Date().toISOString().slice(0, 10), W - 40, 56);
      c.textAlign = 'left';

      // KPI cards
      var yr = last.date.slice(0, 4), pyr = String(Number(yr) - 1);
      var avgOf = function (list) { return list.length ? list.reduce(function (s, r) { return s + Number(r.ft40); }, 0) / list.length : null; };
      var avgY = avgOf(r40.filter(function (r) { return r.date.slice(0, 4) === yr; }));
      var avgP = avgOf(r40.filter(function (r) { return r.date.slice(0, 4) === pyr; }));
      var peak = r40.reduce(function (m, r) { return Number(r.ft40) > Number(m.ft40) ? r : m; }, r40[0]);
      var dv = prev ? Number(last.ft40) - Number(prev.ft40) : 0;
      var cards = [
        ['최신 40FT 운임', money(last.ft40), last.date, TEXT],
        ['직전 대비', (dv > 0 ? '▲ ' : dv < 0 ? '▼ ' : '') + money(Math.abs(dv)), prev ? (dv >= 0 ? '+' : '') + (dv / Number(prev.ft40) * 100).toFixed(1) + '%  vs ' + prev.date : '', dv > 0 ? UP : dv < 0 ? DOWN : TEXT],
        ['기간 최고 40FT', money(peak.ft40), peak.date, TEXT],
        [yr + '년 평균 40FT', avgY ? money(avgY) : '—', avgP ? (avgY >= avgP ? '▲ ' : '▼ ') + Math.abs((avgY - avgP) / avgP * 100).toFixed(1) + '%  vs ' + pyr + '년 ' + money(avgP) : '', TEXT]
      ];
      var cw = (W - 80 - 3 * 20) / 4;
      cards.forEach(function (k, i) {
        var x = 40 + i * (cw + 20), y = 108;
        c.fillStyle = PANEL; c.strokeStyle = GRID; c.lineWidth = 1;
        c.beginPath(); c.roundRect ? c.roundRect(x, y, cw, 96, 10) : c.rect(x, y, cw, 96); c.fill(); c.stroke();
        c.fillStyle = RED; c.fillRect(x, y + 14, 3, 68);
        c.fillStyle = SUB; c.font = '600 14px ' + F; c.fillText(k[0], x + 18, y + 30);
        c.fillStyle = k[3]; c.font = '700 30px ' + F; c.fillText(k[1], x + 18, y + 66);
        c.fillStyle = SUB; c.font = '13px ' + F; c.fillText(k[2], x + 18, y + 86);
      });

      // Main chart: 40FT and 20FT over time
      var L = 90, R = W - 40, T = 250, B = 600;
      c.fillStyle = TEXT; c.font = '700 17px ' + F; c.fillText('40FT 운임 변동 추이', 40, 238);
      var tMin = t(rows[0]), tMax = t(rows[rows.length - 1]);
      var vMax = Math.max.apply(null, r40.map(function (r) { return Number(r.ft40); }));
      var yTop = Math.ceil(vMax * 1.1 / 1000) * 1000;
      var X = function (tt) { return L + (tt - tMin) / Math.max(1, tMax - tMin) * (R - L); };
      var Y = function (v) { return B - v / yTop * (B - T); };
      c.font = '12px ' + F; c.textAlign = 'right';
      for (var g = 0; g <= yTop; g += yTop <= 6000 ? 1000 : 2000) {
        c.strokeStyle = GRID; c.setLineDash([4, 4]); c.beginPath(); c.moveTo(L, Y(g)); c.lineTo(R, Y(g)); c.stroke(); c.setLineDash([]);
        c.fillStyle = SUB; c.fillText(kfmt(g), L - 10, Y(g) + 4);
      }
      c.textAlign = 'center';
      var y0 = new Date(tMin).getFullYear(), y1 = new Date(tMax).getFullYear();
      for (var yy = y0; yy <= y1; yy++) {
        [0, 3, 6, 9].forEach(function (m) {
          var tt = new Date(yy, m, 1).getTime();
          if (tt < tMin || tt > tMax) return;
          c.strokeStyle = m === 0 ? '#d1d5db' : GRID; c.beginPath(); c.moveTo(X(tt), B); c.lineTo(X(tt), B + (m === 0 ? 8 : 4)); c.stroke();
          c.fillStyle = m === 0 ? TEXT : SUB; c.font = (m === 0 ? '700 13px ' : '12px ') + F;
          c.fillText(m === 0 ? String(yy) : (m + 1) + '월', X(tt), B + 24);
        });
      }
      c.strokeStyle = '#d1d5db'; c.beginPath(); c.moveTo(L, B); c.lineTo(R, B); c.stroke();
      function line(list, key, color, area) {
        if (!list.length) return;
        if (area) {
          var grad = c.createLinearGradient(0, T, 0, B);
          grad.addColorStop(0, color + '33'); grad.addColorStop(1, color + '00');
          c.fillStyle = grad; c.beginPath(); c.moveTo(X(t(list[0])), B);
          list.forEach(function (r) { c.lineTo(X(t(r)), Y(Number(r[key]))); });
          c.lineTo(X(t(list[list.length - 1])), B); c.closePath(); c.fill();
        }
        c.strokeStyle = color; c.lineWidth = 2.4; c.beginPath();
        list.forEach(function (r, i) { var px = X(t(r)), py = Y(Number(r[key])); if (i) c.lineTo(px, py); else c.moveTo(px, py); });
        c.stroke(); c.lineWidth = 1;
        list.forEach(function (r) { c.fillStyle = '#fff'; c.beginPath(); c.arc(X(t(r)), Y(Number(r[key])), 3.2, 0, 7); c.fill(); c.strokeStyle = color; c.lineWidth = 1.6; c.stroke(); c.lineWidth = 1; });
      }
        line(r40, 'ft40', RED, true);
      // labels: peak and latest
      c.font = '700 13px ' + F; c.fillStyle = RED;
      c.fillText(money(peak.ft40), X(t(peak)), Y(Number(peak.ft40)) - 12);
      c.textAlign = 'right'; (function () { var lbl = '최신 ' + money(last.ft40), lx = X(t(last)) - 2, ly = Y(Number(last.ft40)) - 16, lw = c.measureText(lbl).width; c.fillStyle = 'rgba(255,255,255,.92)'; c.strokeStyle = RED; c.lineWidth = 1; c.beginPath(); c.roundRect ? c.roundRect(lx - lw - 8, ly - 15, lw + 16, 21, 5) : c.rect(lx - lw - 8, ly - 15, lw + 16, 21); c.fill(); c.stroke(); c.fillStyle = RED; c.fillText(lbl, lx, ly); })();
      // legend
      c.textAlign = 'left'; c.font = '13px ' + F;
      [[RED, '40FT']].forEach(function (lg, i) {
        var lx = R - 75 + i * 75, ly = 232;
        c.strokeStyle = lg[0]; c.lineWidth = 3; c.beginPath(); c.moveTo(lx, ly - 4); c.lineTo(lx + 22, ly - 4); c.stroke(); c.lineWidth = 1;
        c.fillStyle = TEXT; c.fillText(lg[1], lx + 28, ly);
      });

      // Bottom left: yearly average 40FT (bars) with change
      var years = []; for (var y2 = y0; y2 <= y1; y2++) years.push(String(y2));
      var yAvg = years.map(function (y) { return avgOf(r40.filter(function (r) { return r.date.slice(0, 4) === y; })); });
      var BT = 690, BB = 940, BL = 70, BR = 640;
      c.fillStyle = TEXT; c.font = '700 17px ' + F; c.fillText('연도별 40FT 평균 운임', 40, 668);
      var bMax = Math.max.apply(null, yAvg.filter(Boolean)) * 1.25;
      var slot = (BR - BL) / years.length;
      c.strokeStyle = '#d1d5db'; c.beginPath(); c.moveTo(BL, BB); c.lineTo(BR, BB); c.stroke();
      years.forEach(function (y, i) {
        var v = yAvg[i]; if (!v) return;
        var bx = BL + i * slot + slot * 0.22, bw = slot * 0.56, bh = v / bMax * (BB - BT);
        c.fillStyle = y === yr ? RED : '#e7b3b2'; c.fillRect(bx, BB - bh, bw, bh);
        c.textAlign = 'center'; c.fillStyle = TEXT; c.font = '700 14px ' + F; c.fillText(money(v), bx + bw / 2, BB - bh - 10);
        if (i && yAvg[i - 1]) {
          var ch = (v - yAvg[i - 1]) / yAvg[i - 1] * 100;
          c.fillStyle = ch >= 0 ? UP : DOWN; c.font = '600 12px ' + F; c.fillText((ch >= 0 ? '▲ ' : '▼ ') + Math.abs(ch).toFixed(1) + '%', bx + bw / 2, BB - bh - 28);
        }
        c.fillStyle = TEXT; c.font = '700 13px ' + F; c.fillText(y, bx + bw / 2, BB + 20);
      });
      c.textAlign = 'left';

      // Bottom right: quarterly average 40FT by year (grouped bars)
      var QL = 720, QR = W - 40;
      c.fillStyle = TEXT; c.font = '700 17px ' + F; c.fillText('분기별 40FT 평균 운임 (연도별)', QL - 20, 668);
      var qAvg = years.map(function (y) {
        return [0, 1, 2, 3].map(function (q) {
          return avgOf(r40.filter(function (r) { var m = Number(r.date.slice(5, 7)); return r.date.slice(0, 4) === y && Math.floor((m - 1) / 3) === q; }));
        });
      });
      var qMax = Math.max.apply(null, [].concat.apply([], qAvg).filter(Boolean)) * 1.15;
      var qslot = (QR - QL) / years.length;
      c.strokeStyle = '#d1d5db'; c.beginPath(); c.moveTo(QL, BB); c.lineTo(QR, BB); c.stroke();
      years.forEach(function (y, i) {
        var gx = QL + i * qslot + qslot * 0.1, gw = qslot * 0.8, bw = gw / 4 - 4;
        qAvg[i].forEach(function (v, q) {
          if (!v) return;
          var bx = gx + q * (bw + 4), bh = v / qMax * (BB - BT);
          c.fillStyle = QC[q]; c.fillRect(bx, BB - bh, bw, bh);
          c.save(); c.translate(bx + bw / 2 + 4, BB - bh - 6); c.rotate(-Math.PI / 2);
          c.fillStyle = SUB; c.font = '11px ' + F; c.textAlign = 'left'; c.fillText(kfmt(v), 0, 0); c.restore();
        });
        c.textAlign = 'center'; c.fillStyle = TEXT; c.font = '700 13px ' + F; c.fillText(y, gx + gw / 2, BB + 20);
      });
      c.textAlign = 'left'; c.font = '12px ' + F;
      ['1Q', '2Q', '3Q', '4Q'].forEach(function (q, i) {
        var lx = QR - 4 * 52 + i * 52, ly = 668;
        c.fillStyle = QC[i]; c.fillRect(lx, ly - 10, 12, 12);
        c.fillStyle = TEXT; c.fillText(q, lx + 17, ly);
      });
      c.fillStyle = SUB; c.font = '12px ' + F;
      c.fillText('POL: CN SHANGHAI  ·  POD: GT PUERTO QUETZAL  ·  출처: LX판토스 시장가', 40, H - 18);
      return cv;
    }

    function save(blob, filename, btn) {
      var done = function (ok) {
        if (!btn) return;
        btn.dataset.dlState = ok ? 'ok' : 'err';
        setTimeout(function () { delete btn.dataset.dlState; }, 1800);
      };
      var anchor = function () {
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob); a.download = filename;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
        done(true);
      };
      if (window.claude && window.claude.use) {
        Promise.resolve(window.claude.use('downloads')).then(function (dl) {
          if (!dl) { anchor(); return; }
          dl.save({ filename: filename, data: blob }).then(function () { done(true); }, function (err) { if (!err || err.code !== 'declined') done(false); });
        }, anchor);
      } else {
        anchor();
      }
    }

    Array.prototype.slice.call(document.querySelectorAll('#gt-freight-dl')).forEach(function (btn) {
      btn.addEventListener('click', function () {
        var d = dash.data('freight_rate');
        if (d.status !== 'ok' || !d.data || !d.data.length) { btn.dataset.dlState = 'err'; setTimeout(function () { delete btn.dataset.dlState; }, 1800); return; }
        var rows = d.data.filter(function (r) { return r && r.date; }).slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; });
        var cv = freightPng(rows);
        cv.toBlob(function (blob) {
          if (!blob) { btn.dataset.dlState = 'err'; return; }
          save(blob, 'Shanghai_Guatemala_freight_' + rows[rows.length - 1].date.replace(/-/g, '') + '.png', btn);
        }, 'image/png');
      });
    });
  })();

  // ---- tiles + lede
  dash.onData(() => {
    const s = dash.data('summary');
    document.querySelectorAll('#net-ca [data-source="summary"]').forEach((el) => {
      if (s.status === 'ok' && s.data[0]) {
        el.classList.remove('dash-skeleton');
        const v = s.data[0][el.dataset.field];
        el.textContent = v === '' || v == null ? '—' : String(v);
      } else if (s.status !== 'loading') {
        el.classList.remove('dash-skeleton');
        el.textContent = '—';
      }
    });
  });

  // ---- sailings table
  (() => {
    const table = document.getElementById('gt-sail-table');
    const body = table.tBodies[0];
    const q = document.getElementById('gt-sail-q');
    let stage = '', sortKey = 'pq_eta', dir = 1;
    document.querySelectorAll('#gt-sailings .chip').forEach((b) => b.addEventListener('click', () => {
      stage = b.dataset.stage;
      document.querySelectorAll('#gt-sailings .chip').forEach((c) => c.setAttribute('aria-pressed', String(c === b)));
      draw();
    }));
    q.addEventListener('input', () => draw());
    table.querySelectorAll('th button').forEach((b) => b.addEventListener('click', () => {
      const k = b.dataset.sort;
      dir = sortKey === k ? -dir : 1; sortKey = k;
      table.querySelectorAll('th button').forEach((x) => x.removeAttribute('aria-sort'));
      b.setAttribute('aria-sort', dir > 0 ? 'ascending' : 'descending');
      draw();
    }));
    function draw() {
      const d = dash.data('sailings');
      body.replaceChildren();
      const wrap = table.parentElement;
      wrap.querySelector('.fail')?.remove();
      if (d.status === 'error') { const f = document.createElement('div'); f.className = 'fail'; f.textContent = 'Failed to load'; wrap.appendChild(f); return; }
      if (d.status !== 'ok') return;
      const term = q.value.trim().toUpperCase();
      // On the Arrived tab, keep arrived sailings visible for a year; everywhere else
      // (All / Upcoming / At sea) they drop off two weeks after arrival.
      const cut = Date.now() - (stage === '과테말라 도착' ? 365 : 14) * 864e5;
      const rows = d.data.filter((r) => !(r.pq_status === 'ACTUAL' && window.gtDate(r.pq_eta) < cut))
        .filter((r) => (!stage || r.stage === stage) && (!term || r.vessel.includes(term)))
        .slice().sort((a, b) => {
          const x = a[sortKey], y = b[sortKey];
          if (x === y) return 0;
          if (x == null || x === '') return 1;
          if (y == null || y === '') return -1;

  (() => {

      bar.setAttribute('aria-hidden', 'true');
      nav.appendChild(bar);
      var place = function () { placeIndicator(nav, bar); };
      place();
      setTimeout(place, 80);
      setTimeout(place, 400);
      window.addEventListener('resize', place);
      new MutationObserver(place).observe(nav, { attributes: true, attributeFilter: ['aria-selected'], subtree: true });
    });

    function wirePop(attr) {
      new MutationObserver(function (muts) {
        muts.forEach(function (m) {
          var t = m.target;
          if (t.getAttribute && t.getAttribute(attr) === 'true') {
            t.classList.remove('lx-pop');
            void t.offsetWidth;
            t.classList.add('lx-pop');
          }
        });
      }).observe(document.body, { attributes: true, attributeFilter: [attr], subtree: true });
    }
    wirePop('aria-selected');
    wirePop('aria-pressed');

    Array.prototype.slice.call(document.querySelectorAll('.lx-table tbody')).forEach(function (tb) {
      new MutationObserver(function () {
        Array.prototype.slice.call(tb.rows).forEach(function (tr, i) {
          tr.classList.remove('lx-row-reveal');
          tr.style.animationDelay = Math.min(i * 22, 260) + 'ms';
          void tr.offsetWidth;
          tr.classList.add('lx-row-reveal');
        });
      }).observe(tb, { childList: true });
    });

    Array.prototype.slice.call(document.querySelectorAll('.gt .chart')).forEach(function (box) {
      new MutationObserver(function () {
        var svg = box.querySelector('svg');
        if (!svg) return;
        Array.prototype.slice.call(svg.querySelectorAll('path')).forEach(function (p) {
          if (p.classList.contains('lx-draw-path')) return;
          try {
            var len = p.getTotalLength();
            if (!len) return;
            p.classList.add('lx-draw-path');
            p.style.strokeDasharray = len;
            p.style.strokeDashoffset = len;
            requestAnimationFrame(function () {
              requestAnimationFrame(function () { p.style.strokeDashoffset = '0'; });
            });
          } catch (e) {}
        });
        Array.prototype.slice.call(svg.querySelectorAll('rect')).forEach(function (r, i) {
          if (r.classList.contains('lx-draw-rect')) return;
          var w = r.getAttribute('width');
          if (!w) return;
          r.classList.add('lx-draw-rect');
          r.style.width = '0px';
          setTimeout(function () { r.style.width = w + 'px'; }, 30 + i * 40);
        });
      }).observe(box, { childList: true, subtree: true });
    });
  } catch (e) { /* visual flourish only; never break the dashboard */ }
})();
</script>
