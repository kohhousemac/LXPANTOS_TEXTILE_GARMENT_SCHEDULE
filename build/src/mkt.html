<script>
// ---- Market rate (40ft) mini chart under each lane's schedule (same as the dashboard) ----
(function () {
  function mktDraw(el, id) {
    var g = dash.data('market_rate_40');
    if (g.status === 'loading') { el.classList.add('dash-skeleton'); return; }
    el.classList.remove('dash-skeleton');
    el.replaceChildren();
    if (g.status !== 'ok') {
      var f = document.createElement('p'); f.className = 'lx-mkt-empty'; f.textContent = 'Failed to load'; el.appendChild(f);
      return;
    }
    var rows = (g.data || []).filter(function (r) { return r.routeId === id && Number(r.ft40) > 0; })
      .map(function (r) { return { date: r.date, period: r.period, note: r.note || '', terms: r.terms, v: Number(r.ft40), t: new Date(r.date + 'T00:00:00').getTime() }; })
      .sort(function (a, b) { return a.t - b.t; });
    if (!rows.length) {
      var e = document.createElement('p'); e.className = 'lx-mkt-empty'; e.textContent = '—'; el.appendChild(e);
      return;
    }
    var color = (dash.colors && dash.colors[1]) || '#2563eb';
    var W = el.clientWidth || 600, H = 150, top = 18, bottom = 22, left = 46, right = 12;
    var svg = d3.select(el).append('svg').attr('width', '100%').attr('viewBox', '0 0 ' + W + ' ' + H)
      .attr('role', 'img').attr('aria-label', 'Market rate 40ft over time');
    var tMin = rows[0].t, tMax = rows[rows.length - 1].t;
    if (tMax === tMin) tMax = tMin + 864e5;
    var x = d3.scaleLinear([tMin, tMax], [left, W - right]);
    var y = d3.scaleLinear().domain([0, d3.max(rows, function (r) { return r.v; })]).nice().range([H - bottom, top]);
    var gg = svg.append('g');
    var yt = y.ticks(4);
    gg.selectAll('line.grid').data(yt).join('line').attr('x1', left).attr('x2', W - right)
      .attr('y1', function (t) { return y(t); }).attr('y2', function (t) { return y(t); }).attr('stroke', 'var(--cds-chart-grid, var(--color-border-line))');
    gg.selectAll('text.yt').data(yt).join('text').attr('x', left - 6).attr('y', function (t) { return y(t) + 4; })
      .attr('text-anchor', 'end').attr('font-size', 10).attr('fill', 'var(--color-fg-muted)')
      .text(function (t) { return '$' + (t >= 1000 ? (t / 1000) + 'k' : t); });
    var years = [];
    for (var yr = new Date(tMin).getFullYear() + 1; yr <= new Date(tMax).getFullYear(); yr++) years.push(yr);
    gg.selectAll('text.xt').data(years).join('text').attr('x', function (yr) { return x(new Date(yr, 0, 1).getTime()); })
      .attr('y', H - 6).attr('text-anchor', 'middle').attr('font-size', 10).attr('fill', 'var(--color-fg-muted)')
      .text(function (yr) { return String(yr); });
    gg.append('path').datum(rows).attr('fill', 'none').attr('stroke', color).attr('stroke-width', 1.8)
      .attr('d', d3.line().x(function (r) { return x(r.t); }).y(function (r) { return y(r.v); }));
    var last = rows[rows.length - 1];
    gg.append('circle').attr('cx', x(last.t)).attr('cy', y(last.v)).attr('r', 3.2).attr('fill', color);
    gg.append('text').attr('x', W - right).attr('y', 12).attr('text-anchor', 'end').attr('font-size', 11)
      .attr('fill', 'var(--color-fg)').attr('font-weight', 600)
      .text('$' + last.v.toLocaleString() + ' (' + (last.note ? last.note + ' · ' : '') + last.date.slice(5).replace('-', '/') + ')');
    var tip = document.createElement('div'); tip.className = 'lx-mkt-tip'; tip.style.display = 'none'; el.appendChild(tip);
    var dot = gg.append('circle').attr('r', 3.5).attr('fill', color).attr('display', 'none');
    svg.append('rect').attr('x', left).attr('y', top).attr('width', Math.max(1, W - left - right)).attr('height', H - top - bottom)
      .attr('fill', 'transparent')
      .on('mousemove', function (ev) {
        var p = d3.pointer(ev, svg.node());
        var tt = x.invert(p[0]), best = rows[0], bd = Infinity;
        rows.forEach(function (r) { var d = Math.abs(r.t - tt); if (d < bd) { bd = d; best = r; } });
        dot.attr('display', null).attr('cx', x(best.t)).attr('cy', y(best.v));
        tip.replaceChildren();
        var a = document.createElement('div'); a.className = 'd'; a.textContent = best.period + (best.note ? ' · ' + best.note : '') + ' · ' + best.terms;
        var b = document.createElement('div'); b.textContent = '40ft $' + best.v.toLocaleString();
        tip.appendChild(a); tip.appendChild(b);
        tip.style.display = '';
        var scale = el.clientWidth / W;
        var px = x(best.t) * scale, py = y(best.v) * scale;
        var tw = tip.offsetWidth;
        tip.style.left = Math.max(0, Math.min(px + 10, el.clientWidth - tw - 2)) + 'px';
        tip.style.top = Math.max(0, py - 40) + 'px';
      })
      .on('mouseleave', function () { tip.style.display = 'none'; dot.attr('display', 'none'); });
  }
  Array.prototype.slice.call(document.querySelectorAll('[data-draw^="mkt-"]')).forEach(function (e) {
    var id = e.getAttribute('data-draw').slice(4);
    dash.draw('mkt-' + id, function (el) { mktDraw(el, id); });
  });
})();
</script>

<script>
// ---- Port berthing wait per SITC / Wan Hai lane (same as the dashboard) ----
(function () {
  var WINDOW_DAYS = 60;
  var MAX_LEG_DAYS = 10;
  var BW_ENDS = {
    cnsha_vnhph: ['CNSHA', 'VNHPH'], cnsha_vnsgn: ['CNSHA', 'VNSGN'], vnsgn_cnsha: ['VNSGN', 'CNSHA'],
    vnhph_cnsha: ['VNHPH', 'CNSHA'], vnhph_idjkt: ['VNHPH', 'IDJKT'], idjkt_vnhph: ['IDJKT', 'VNHPH'],
    vnsgn_idjkt: ['VNSGN', 'IDJKT'],
    twkel_vnsgn: ['TWKHH', 'VNSGN'], twkel_vnhph: ['TWKHH', 'VNHPH'], cnshk_vnsgn: ['CNSHK', 'VNSGN']
  };
  var BW_CARRIERS = ['SITC', 'WHL'];
  function parseT(s) { if (!s) return NaN; return new Date(String(s).replace(/\//g, '-').replace(' ', 'T')).getTime(); }

  function bwDraw(el, id) {
    var lane = dash.data(id), log = dash.data('sitc_berth_log'), wlog = dash.data('whl_berth_log');
    if (lane.status === 'loading' || log.status === 'loading' || wlog.status === 'loading') { el.classList.add('dash-skeleton'); return; }
    el.classList.remove('dash-skeleton');
    el.replaceChildren();
    function msg(t) { var p = document.createElement('p'); p.className = 'lx-mkt-empty'; p.textContent = t; el.appendChild(p); }
    if (lane.status !== 'ok' || (log.status !== 'ok' && wlog.status !== 'ok')) { msg('Failed to load'); return; }
    var vs = {};
    (lane.data || []).forEach(function (r) {
      var c = String(r.carrier || '');
      if (BW_CARRIERS.some(function (k) { return c.indexOf(k) !== -1; })) vs[r.vessel] = 1;
    });
    var cut = Date.now() - WINDOW_DAYS * 864e5;
    var ends = BW_ENDS[id] || [];
    var pol = [].concat(ends[0]), pod = ends[1];
    var allLog = (log.status === 'ok' ? log.data || [] : []).concat(wlog.status === 'ok' ? wlog.data || [] : []);
    var byVessel = {};
    allLog.forEach(function (r) { if (!vs[r.vessel]) return; (byVessel[r.vessel] = byVessel[r.vessel] || []).push(r); });
    var by = {}, seen = {};
    Object.keys(byVessel).forEach(function (v) {
      var calls = byVessel[v].slice().sort(function (a, b) { return parseT(a.ata) - parseT(b.ata); });
      for (var i = 0; i < calls.length; i++) {
        if (pol.indexOf(calls[i].portCode) === -1) continue;
        var j = i + 1;
        while (j < calls.length && calls[j].portCode !== pod && pol.indexOf(calls[j].portCode) === -1) j++;
        if (j >= calls.length || calls[j].portCode !== pod) continue;
        if (parseT(calls[j].ata) - parseT(calls[i].ata) > MAX_LEG_DAYS * 864e5) { i = j - 1; continue; }
        for (var k = i; k <= j; k++) {
          var r = calls[k];
          var key = r.vessel + '|' + r.voyage + '|' + r.portCode;
          if (seen[key]) continue;
          seen[key] = 1;
          var t = parseT(r.atb), w = Number(r.wait_days);
          if (!(t >= cut) || !(w >= 0)) continue;
          (by[r.port] = by[r.port] || []).push(w);
        }
        i = j - 1;
      }
    });
    var rows = Object.keys(by).map(function (p) {
      var v = by[p], s = 0, m = 0;
      v.forEach(function (x) { s += x; if (x > m) m = x; });
      return { port: p, avg: Math.round(s / v.length * 10) / 10, max: Math.round(m * 10) / 10, calls: v.length };
    }).sort(function (a, b) { return b.avg - a.avg; });
    if (!rows.length) {
      msg(Object.keys(vs).length ? '수집 중 — 이 노선 모선의 최근 60일 출발항~도착항 구간 접안 실측이 아직 없습니다.' : '현재 이 노선 스케줄에 SITC·완하이 모선이 없습니다.');
      return;
    }
    var W = el.clientWidth || 600, rowH = 24, top = 4;
    var H = top + rows.length * rowH + 4;
    var svg = d3.select(el).append('svg').attr('width', '100%').attr('viewBox', '0 0 ' + W + ' ' + H)
      .attr('role', 'img').attr('aria-label', 'Average berthing wait days by port');
    var meas = svg.append('text').attr('font-size', 12);
    var lw = 0, rw = 0;
    rows.forEach(function (r) {
      meas.text(r.port); lw = Math.max(lw, meas.node().getComputedTextLength());
      meas.text(r.avg + 'd (max ' + r.max + 'd · ' + r.calls + ' calls)'); rw = Math.max(rw, meas.node().getComputedTextLength());
    });
    meas.remove();
    var left = Math.ceil(lw) + 12, right = Math.ceil(rw) + 12;
    var x = d3.scaleLinear([0, d3.max(rows, function (r) { return r.avg; }) || 1], [left, Math.max(left + 40, W - right)]);
    var g = svg.selectAll('g.row').data(rows).join('g').attr('class', 'row')
      .attr('transform', function (r, i) { return 'translate(0,' + (top + i * rowH) + ')'; });
    g.append('text').attr('x', left - 8).attr('y', rowH / 2 + 4).attr('text-anchor', 'end').attr('font-size', 12)
      .attr('fill', 'var(--color-fg)').text(function (r) { return r.port; });
    g.append('rect').attr('x', left).attr('y', 5).attr('height', rowH - 10).attr('rx', 4)
      .attr('width', function (r) { return Math.max(2, x(r.avg) - left); })
      .attr('fill', function (r) { return r.avg >= 2 ? 'var(--cds-chart-status-critical, var(--color-bad))' : dash.colors[0]; });
    g.append('text').attr('x', function (r) { return x(r.avg) + 6; }).attr('y', rowH / 2 + 4).attr('font-size', 12)
      .attr('fill', 'var(--color-fg-muted)')
      .text(function (r) { return r.avg + 'd (max ' + r.max + 'd · ' + r.calls + ' calls)'; });
  }
  Array.prototype.slice.call(document.querySelectorAll('[data-draw^="bw-"]')).forEach(function (e) {
    var id = e.getAttribute('data-draw').slice(3);
    dash.draw('bw-' + id, function (el) { bwDraw(el, id); });
  });
})();
</script>

<script>
// Charts drawn inside a hidden tab measure 0px wide; redraw them once they become visible / change width.
(function () {
  if (!window.ResizeObserver) return;
  var last = new WeakMap();
  var ro = new ResizeObserver(function (entries) {
    entries.forEach(function (en) {
      var w = Math.round(en.contentRect.width), el = en.target;
      if (!w || last.get(el) === w) return;
      last.set(el, w);
      dash.draw(el.getAttribute('data-draw'));
    });
  });
  Array.prototype.slice.call(document.querySelectorAll('[data-draw^="mkt-"], [data-draw^="bw-"]')).forEach(function (el) { ro.observe(el); });
})();
</script>
