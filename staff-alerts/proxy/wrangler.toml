# Cloudflare Pages front door: vessel-alert.pages.dev (no company name in the address).
# Company networks block *.workers.dev, so the page is served on our own
# subdomain and every request is passed straight to the Worker.
name = "vessel-alert"
pages_build_output_dir = "public"
compatibility_date = "2025-01-01"

[[services]]
binding = "STAFF"
service = "lxpantosfashionstaff"
