name = "lxpantosfashionstaff"
main = "src/worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

# Bookings store. Create once with:  npx wrangler kv namespace create BOOKINGS
# then paste the printed id here.
[[kv_namespaces]]
binding = "BOOKINGS"
id = "2329f0c72d144f8a9266e2bdc814877c"

# Check schedules every 3 hours (UTC). Same alert is mailed only once.
[triggers]
crons = ["15 */3 * * *"]

[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

[vars]
ALLOWED_DOMAIN = "lxpantos.com"
DATA_BASE = "https://raw.githubusercontent.com/kohhousemac/LXPANTOS_TEXTILE_GARMENT_SCHEDULE/main/build/data"
PAGE_URL = "https://lxpantosfashionstaff.lxpantos.workers.dev/"
# "log" = print only, "gmail" = send from SMTP_USER via Gmail.
MAIL_MODE = "gmail"
SMTP_USER = "kohhousemac@gmail.com"
MAIL_FROM_NAME = "LX Pantos Vessel Alerts"
# SMTP_PASS (Gmail app password) is a secret: set it in the Cloudflare dashboard.
# Secrets (not in this file):
#   STAFF_PASSWORD   shared staff password   ->  npx wrangler secret put STAFF_PASSWORD
#   SESSION_SECRET   random signing key       ->  npx wrangler secret put SESSION_SECRET
